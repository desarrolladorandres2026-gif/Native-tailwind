<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF655B"/>
      <stop offset="100%" stop-color="#FD297B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App icon: rounded square -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#gradIcon)"/>

  <!-- D shape -->
  <path d="M22 20 L22 80 L48 80 Q80 80 80 50 Q80 20 48 20 Z" fill="white"/>
  <!-- Inner cutout -->
  <path d="M34 32 L48 32 Q66 32 66 50 Q66 68 48 68 L34 68 Z" fill="url(#gradIcon)"/>

  <!-- Two faces in negative space -->
  <circle cx="50" cy="42" r="7" fill="white"/>
  <path d="M45.5 51 Q50 57 54.5 51" fill="white"/>
  <circle cx="63" cy="42" r="7" fill="white"/>
  <path d="M58.5 51 Q63 57 67.5 51" fill="white"/>
</svg>
