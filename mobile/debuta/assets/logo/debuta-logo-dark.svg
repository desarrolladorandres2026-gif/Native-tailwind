<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF655B"/>
      <stop offset="100%" stop-color="#FD297B"/>
    </linearGradient>
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF655B"/>
      <stop offset="100%" stop-color="#FD297B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="320" height="100" fill="#0D0D0D" rx="12"/>

  <!-- Icon -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#gradIcon)" filter="url(#glow)"/>
  <path d="M26 26 L26 74 L46 74 Q72 74 72 50 Q72 26 46 26 Z" fill="#0D0D0D"/>
  <path d="M34 34 L46 34 Q62 34 62 50 Q62 66 46 66 L34 66 Z" fill="url(#gradIcon)"/>
  <circle cx="49" cy="41" r="5.5" fill="#0D0D0D"/>
  <path d="M46 47 Q49 52 52 47" fill="#0D0D0D"/>
  <circle cx="59" cy="41" r="5.5" fill="#0D0D0D"/>
  <path d="M56 47 Q59 52 62 47" fill="#0D0D0D"/>

  <!-- Wordmark -->
  <text
    x="110"
    y="65"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
    fill="white"
  >Debuta</text>
</svg>
