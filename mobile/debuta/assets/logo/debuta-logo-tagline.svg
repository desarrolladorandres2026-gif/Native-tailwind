<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF655B"/>
      <stop offset="100%" stop-color="#FD297B"/>
    </linearGradient>
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF655B"/>
      <stop offset="100%" stop-color="#FD297B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#gradIcon)" filter="url(#glow)"/>
  <path d="M26 26 L26 74 L46 74 Q72 74 72 50 Q72 26 46 26 Z" fill="white"/>
  <path d="M34 34 L46 34 Q62 34 62 50 Q62 66 46 66 L34 66 Z" fill="url(#gradIcon)"/>
  <circle cx="49" cy="41" r="5.5" fill="white"/>
  <path d="M46 47 Q49 52 52 47" fill="white"/>
  <circle cx="59" cy="41" r="5.5" fill="white"/>
  <path d="M56 47 Q59 52 62 47" fill="white"/>

  <!-- Wordmark -->
  <text
    x="110"
    y="60"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#grad)"
  >Debuta</text>

  <!-- Tagline -->
  <text
    x="111"
    y="82"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="3.5"
    fill="#FF8C7A"
  >CONEXIONES REALES</text>

  <!-- Thin separator line under wordmark -->
  <line x1="110" y1="69" x2="308" y2="69" stroke="#FF655B" stroke-width="0.8" stroke-opacity="0.35"/>
</svg>
